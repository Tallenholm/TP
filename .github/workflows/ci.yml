name: CI

on:
  push:
    branches: [m1-executable-core-clean]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.0
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Smoke hello example
        shell: bash
        run: |
          output="$(cargo run --locked --quiet -p tp-cli -- run examples/hello.tp)"
          test "$output" = "Hello from TP"
      - name: Smoke fibonacci example
        shell: bash
        run: |
          output="$(cargo run --locked --quiet -p tp-cli -- run examples/fibonacci.tp)"
          test "$output" = "55"
